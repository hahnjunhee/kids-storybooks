<!doctype html>
<html lang="ko">
  <head>

    <style>
      * { margin:0; padding:0; box-sizing:border-box; }
      html, body { width:1280px; height:720px; overflow:hidden; background:#fff7e6; }

      <div id="s2" data-composition-id="s2" data-composition-src="compositions/s2.html" data-start="10.0" data-duration="10.0" data-track-index="0" data-track-kind="graphics" data-width="1280" data-height="720"></div>
      <div id="s3" data-composition-id="s3" data-composition-src="compositions/s3.html" data-start="20.0" data-duration="10.0" data-track-index="0" data-track-kind="graphics" data-width="1280" data-height="720"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f9e9f7">
<meta name="description" content="반짝반짝 그림책 도서관 — 용기와 다정함이 자라는 창작 그림책 도서관">
<title>반짝반짝 그림책 도서관 🦄</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='85'%3E🦄%3C/text%3E%3C/svg%3E">
<style>
:root{font-family:system-ui,-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;color:#473b52;background:#fffaf8}
*{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}
header{background:radial-gradient(ellipse at 70% 0,#fff7c9,transparent 45%),linear-gradient(135deg,#fce4f5,#e7f3ff 60%,#eaf8e6);padding:32px 20px 48px;text-align:center;border-radius:0 0 32px 32px}
h1{font-size:clamp(26px,5vw,44px);line-height:1.25;margin:0 0 8px;color:#6a437b}
header p{font-size:15px;line-height:1.6;margin:auto;max-width:560px;color:#5d4f66}
main{max-width:1050px;margin:-28px auto 48px;padding:0 16px}
.panel{background:#fff;border:1px solid #f0e7ed;box-shadow:0 14px 36px #68506a13;border-radius:24px;padding:clamp(16px,4vw,32px)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #77528a;outline-offset:2px}
.resume{display:flex;gap:14px;align-items:center;text-decoration:none;color:inherit;background:#f5e8f7;border-radius:18px;padding:12px;margin-bottom:18px}
.resume img{width:72px;height:56px;object-fit:cover;border-radius:10px}
.resume small{display:block;font-size:12px;color:#6d4c78;font-weight:700}.resume b{font-size:16px}
.tools{display:flex;gap:10px;flex-wrap:wrap}
.tools input,.tools select{min-height:44px;border:1px solid #eadce9;border-radius:14px;padding:0 14px;font:inherit;font-size:15px;background:#fff;color:inherit}
.tools input{flex:1 1 200px}
.filters{display:flex;gap:8px;overflow-x:auto;margin:14px 0 18px;padding-bottom:4px;scrollbar-width:none}
.filter{flex:none;min-height:44px;background:#fff;border:1px solid #eadce9;border-radius:30px;padding:0 16px;cursor:pointer;color:#6c5073;font:inherit;font-size:15px;font-weight:650}
.filter[aria-pressed=true]{background:#77528a;color:#fff;border-color:#77528a}
.count{font-size:14px;color:#6c6371;margin:0 0 12px}
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.book{position:relative;display:block;border:1px solid #f0e6ef;border-radius:20px;overflow:hidden;text-decoration:none;color:inherit;box-shadow:0 8px 25px #684c6a12;transition:transform .2s}
.book:hover{transform:translateY(-4px)}
.book img{display:block;width:100%;aspect-ratio:1.6;object-fit:cover}
.book .content{padding:16px 18px 18px}
.meta{font-size:13px;color:#6f5574}
.book h3{margin:4px 0 6px;font-size:19px;line-height:1.35}
.book p{margin:0 0 8px;line-height:1.55;font-size:14px;color:#5f5665}
.badge{position:absolute;top:10px;left:10px;background:#ff6b8a;color:#fff;font-size:12px;font-weight:800;padding:4px 10px;border-radius:99px}
.badge.done{background:#6fa86f}
.empty{padding:28px;text-align:center;color:#6f6275;background:#faf6fa;border-radius:18px}
footer{text-align:center;padding:28px;color:#756a78;font-size:13px}
@media(max-width:540px){
 .books{grid-template-columns:1fr;gap:12px}
 .book{display:grid;grid-template-columns:104px 1fr;align-items:stretch;border-radius:16px}
 .book img{height:100%;aspect-ratio:auto}
 .book .content{padding:10px 12px}
 .book h3{font-size:16px;margin:2px 0 4px}
 .book p{font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:0 0 4px}
 .badge{top:6px;left:6px;font-size:11px;padding:2px 8px}
}
.tools button{min-height:44px;border:1px solid #eadce9;border-radius:14px;background:white;color:inherit;font:inherit;padding:0 12px;cursor:pointer}.tools button[aria-pressed=true]{background:#77528a;color:white}.tools input{min-width:0}.filters{flex-wrap:wrap;overflow:visible}.book .date{font-size:12px;color:#6f5574}@media(max-width:540px){.books{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.book{display:block}.book img{height:auto;aspect-ratio:4/3}.book .content{padding:10px}.book h3{overflow-wrap:anywhere}.book p{display:none}.tools input{flex-basis:100%}}
</style>
</head>
<body>
<header>
<h1>🦄 반짝반짝 그림책 도서관</h1>
<p>씩씩한 용기와 다정한 마음이 자라는 곳. 오늘은 어떤 이야기를 읽어볼까요?</p>
</header>
<main>
<div class="panel">
<a class="resume" id="resume" hidden></a>
<div class="tools">
<input id="q" type="search" placeholder="제목·내용으로 찾기" aria-label="그림책 검색">
<select id="sort" aria-label="정렬"><option value="new">최신순</option><option value="name">제목순</option><option value="shuffle" hidden>셔플 중</option></select><button id="shuffle" type="button" aria-pressed="false">⇄ 셔플</button>
</div>
<div class="filters" id="filters" role="group" aria-label="주제별 동화"></div>
<p class="count" id="count" aria-live="polite"></p>
<div class="books" id="books"></div>
<p class="empty" id="empty" hidden aria-live="polite">조건에 맞는 그림책이 없어요. ✨</p>
</div>
</main>
<footer>Made with love for little readers ✨</footer>
<script>
const TOPICS=[['all','전체'],['friendship','친구와 용기'],['habit','생활습관'],['feelings','마음과 감정'],['science','과학 탐험']];
const $=s=>document.querySelector(s);
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let books=[],topic=location.hash.slice(1)||'all';
if(!TOPICS.some(t=>t[0]===topic))topic='all';
const key='library-v32';let saved={};try{saved=JSON.parse(sessionStorage.getItem(key)||'{}')||{}}catch(e){}
const back=performance.getEntriesByType('navigation')[0]?.type==='back_forward';
let order=Array.isArray(saved.order)?saved.order:[];
if(back){$('#q').value=typeof saved.q==='string'?saved.q:'';if(TOPICS.some(t=>t[0]===saved.topic))topic=saved.topic;$('#sort').value=['new','name','shuffle'].includes(saved.sort)?saved.sort:'new'}
function save(){try{sessionStorage.setItem(key,JSON.stringify({q:$('#q').value,topic,sort:$('#sort').value,order,y:scrollY}))}catch(e){}}
function shuffle(){order=books.map(b=>b.id);for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}$('#sort').value='shuffle';render();save()}
$('#shuffle').addEventListener('click',shuffle);
addEventListener('pagehide',save);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function filtersUI(){
 $('#filters').innerHTML=TOPICS.map(([k,l])=>{const n=k==='all'?books.length:books.filter(b=>b.tags.includes(k)).length;
  return `<button class="filter" data-f="${k}" aria-pressed="${k===topic}">${l} ${n}</button>`}).join('');
}
function render(){
 const q=$('#q').value.trim().toLowerCase();
 let list=books.filter(b=>(topic==='all'||b.tags.includes(topic))&&(!q||([b.title,b.desc,b.series,...b.tags,...TOPICS.filter(t=>b.tags.includes(t[0])).map(t=>t[1])].join(' ')).toLowerCase().includes(q)));
 const mode=$('#sort').value;$('#shuffle').setAttribute('aria-pressed',String(mode==='shuffle'));
 const rank=new Map(order.map((id,i)=>[id,i]));
 list.sort((a,b)=>mode==='name'?a.title.localeCompare(b.title,'ko'):mode==='shuffle'?(rank.get(a.id)??Infinity)-(rank.get(b.id)??Infinity)||b.no-a.no:(b.publishedAt||'').localeCompare(a.publishedAt||'')||b.no-a.no);
 $('#books').innerHTML=list.map(b=>`<a class="book" href="${b.href}" data-id="${b.id}">
  
  <img src="${b.cover}" alt="${esc(b.alt)}" width="800" height="500" loading="lazy">
  <div class="content"><div class="meta">${esc(b.series)} · ${b.no}권</div><h3>${esc(b.title)}</h3>${b.publishedAt?`<div class="date">${esc(b.publishedAt.replace(/-/g,'.'))}</div>`:''}<p>${esc(b.desc)}</p><div class="meta">${esc(b.info)}</div></div></a>`).join('');
 $('#empty').hidden=list.length>0;
 $('#count').textContent=`그림책 ${list.length}권`;
}
function resume(){
 const b=books.find(x=>x.id===ls.get('last')),el=$('#resume');
 if(!b){el.hidden=true;return}
 el.href=b.href;el.dataset.id=b.id;el.hidden=false;
 el.innerHTML=`<img src="${b.cover}" alt=""><span><small>최근 열어본 책</small><b>${esc(b.title)}</b></span>`;
}
document.addEventListener('click',e=>{
 const f=e.target.closest('.filter');
 if(f){topic=f.dataset.f;history.replaceState(null,'',topic==='all'?location.pathname:'#'+topic);filtersUI();render();save();return}
 const a=e.target.closest('[data-id]');
 if(a){ls.set('last',a.dataset.id);save()}
});
$('#q').addEventListener('input',()=>{render();save()});$('#sort').addEventListener('change',()=>{render();save()});addEventListener('pageshow',e=>{if(e.persisted)resume()});
fetch('books.json').then(r=>r.json()).then(d=>{books=d;filtersUI();render();resume();if(back&&Number.isFinite(saved.y))requestAnimationFrame(()=>requestAnimationFrame(()=>scrollTo(0,saved.y)))})
 .catch(()=>{$('#empty').hidden=false;$('#empty').textContent='책 목록을 불러오지 못했어요. 새로고침 해주세요.'});
</script>
</body>
</html>

<div class="intro">아래로 스크롤하며 천천히 읽어 주세요 · 3개의 이야기 장면</div>

<section class="spread" id="scene0"><div class="illustration"><img alt="표지 삽화 설명" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 4 3'%3E%3Crect width='4' height='3' fill='%23e3ebd8'/%3E%3C/svg%3E"></div><div class="copy"><div class="eyebrow">작품 분류 · 대상 연령<span>01 / 03</span></div><h1>작품 제목</h1><div class="story"><p>표지 소개 문장(낭독하지 않음)</p></div></div></section>
<section class="spread" id="scene1"><div class="illustration"><img loading="lazy" alt="1장 삽화 설명" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 4 3'%3E%3Crect width='4' height='3' fill='%23e3ebd8'/%3E%3C/svg%3E"></div><div class="copy"><div class="eyebrow">1장<span>02 / 03</span></div><h2>첫 번째 장면 제목</h2><div class="story"><p>본문 첫 문단입니다.</p><p>본문 둘째 문단입니다.</p></div></div></section>
<section class="spread" id="scene2"><div class="illustration"><img loading="lazy" alt="2장 삽화 설명" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 4 3'%3E%3Crect width='4' height='3' fill='%23e3ebd8'/%3E%3C/svg%3E"></div><div class="copy"><div class="eyebrow">2장<span>03 / 03</span></div><h2>두 번째 장면 제목</h2><div class="story"><p>본문 첫 문단입니다.</p></div></div></section>
<section class="activity" id="notes"><div class="eyebrow">발견 노트</div><h2>발견 노트 제목</h2><div class="story"><p>학습 카드와 발견 노트(낭독 범위 밖)</p></div></section>
</main>
